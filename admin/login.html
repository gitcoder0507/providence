<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Providence</title><link rel="icon" type="image/png" href="../images/image.png"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="login-page"><main class="login-shell"><div class="login-brand"><img src="../images/image.png" alt="Providence"><span><strong>Providence</strong><small>Admin Control Room</small></span></div><h1>Admin Login</h1><p>Sign in to review customer enquiries and vendor requests.</p><form id="adminLogin"><div class="login-field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required></div><div class="login-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><p class="login-error" id="loginError" role="alert">Invalid username or password.</p><button class="login-submit" type="submit">Sign in to admin</button></form><p class="login-note">Static demo login. Connect this form to a secure backend before production use.</p></main><script src="login.js"></script></body></html>
